<!-- Botão discreto de tema: um ícone, sem ilustração. O nome diz o que o
     clique faz ("Usar tema claro"), não o estado atual. -->
<button type="button" class="tema" [class.tema--rotulo]="rotulo" (click)="toggleTheme()" [attr.aria-label]="acao()" [matTooltip]="acao()" [matTooltipDisabled]="!!rotulo">
  <app-icon [name]="isDarkMode() ? 'light_mode' : 'dark_mode'" aria-hidden="true"></app-icon>
  @if (rotulo) {
    <!-- Nome curto à vista no topo do celular; o nome completo fica no aria-label. -->
    <span class="tema-rotulo" aria-hidden="true">{{ rotulo }}</span>
  }
</button>

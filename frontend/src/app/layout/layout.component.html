<div class="app-shell" [class.app-shell--convidado]="convidado()">
  <!-- Quem abriu pelo QR Code (sessão anônima) não navega pelo sistema:
       sem menu lateral nem menu de usuário, só a marca e o formulário. -->
  @if (!convidado()) {
    <app-rail></app-rail>
    <!-- Busca global (Ctrl+K), aberta pelo "Buscar…" do menu ou pelo "Mais" do celular. -->
    <app-busca-global></app-busca-global>
  }

  <div class="main-area">
    @for (peca of pecasDemo; track peca) {
      <ng-container *ngComponentOutlet="peca" />
    }
    @if (convidado()) {
      <header class="toolbar toolbar--convidado">
        <app-logo [size]="26" [wordmark]="true"></app-logo>
        <app-theme-toggle></app-theme-toggle>
      </header>
    } @else {
    <!-- Só no celular. No computador a marca, o sino, o tema e a conta moram
         no menu lateral, e a página começa direto no título. -->
    <mat-toolbar class="toolbar toolbar--celular">
      <div class="toolbar-left">
        <a class="toolbar-brand" routerLink="/" aria-label="Zella — início">
          <app-logo [size]="26"></app-logo>
        </a>
      </div>
      <div class="toolbar-right">
        <!-- Ícone com nome embaixo. O tema mora no menu da conta, como no
             rodapé do menu lateral do computador. -->
        @if (usuarioLogado().empresaId) {
          <app-notificacoes rotulo="Avisos"></app-notificacoes>
        }

        <button type="button" [matMenuTriggerFor]="menuUsuario" class="user-menu-trigger" aria-label="Conta: perfil do usuário">
          <span class="user-avatar" aria-hidden="true">{{ usuarioLogado().nome.charAt(0) }}</span>
          <span class="toolbar-rotulo" aria-hidden="true">Conta</span>
        </button>

        <mat-menu #menuUsuario="matMenu" class="usuario-menu" xPosition="before">
          <div class="usuario-menu-header">
            <span class="usuario-menu-nome">{{ usuarioLogado().nome }}</span>
            <span class="usuario-menu-perfil">{{ perfilRotulo() }}</span>
            @if (empresaRotulo()) {
              <span class="usuario-menu-perfil">{{ empresaRotulo() }}</span>
            }
          </div>
          <mat-divider></mat-divider>
          @if (usuarioLogado().empresaId) {
            <button mat-menu-item routerLink="/minha-conta">
              <app-icon name="person"></app-icon>
              <span>Minha conta</span>
            </button>
          }
          <button mat-menu-item (click)="alternarTema()">
            <app-icon [name]="temaEscuro() ? 'light_mode' : 'dark_mode'"></app-icon>
            <span>{{ temaEscuro() ? 'Usar tema claro' : 'Usar tema escuro' }}</span>
          </button>
          <button mat-menu-item (click)="sair()">
            <app-icon name="logout"></app-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>
    }

    <main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<div class="painel-header">
  <div class="painel-titulo">
    <div class="painel-icone">
      <app-icon name="layers"></app-icon>
    </div>
    <div>
      <h2>{{ bloco.nome }}</h2>
      <span class="painel-subtitulo">{{ unidade?.sigla }}</span>
    </div>
  </div>
  <button mat-icon-button (click)="fechar()" aria-label="Fechar">
    <app-icon name="close"></app-icon>
  </button>
</div>

<mat-divider class="painel-divider"></mat-divider>

<div class="painel-conteudo">
  <div class="secao">
    <div class="secao-header">
      <span class="campo-label">Salas</span>
      <button mat-icon-button (click)="novaSala()" aria-label="Nova sala">
        <app-icon name="add"></app-icon>
      </button>
    </div>

    @if (editandoSalaId() !== null) {
      <div class="form-inline">
        <mat-form-field appearance="outline" class="nome-field">
          <mat-label>Nome da sala</mat-label>
          <input matInput [(ngModel)]="nomeSala" name="nomeSala" />
        </mat-form-field>
        <div class="form-inline-acoes">
          <app-flow-button size="sm" (click)="salvarSala()">Salvar</app-flow-button>
          <app-flow-button variant="secondary" type="button" (click)="cancelarSala()">Cancelar</app-flow-button>
        </div>
      </div>
    }

    @if (salas().length) {
      <table mat-table [dataSource]="salas()" class="app-table full-width">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Sala</th>
          <td mat-cell *matCellDef="let s">
            <a class="link-item" [title]="s.nome" (click)="gerenciarEquipamentosDaSala(s)">{{ s.nome }}</a>
          </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let s">
            <button mat-icon-button (click)="gerarQrCodeSala(s)" aria-label="Gerar QR Code">
              <app-icon name="qr_code"></app-icon>
            </button>
            <button mat-icon-button (click)="editarSala(s)" aria-label="Editar">
              <app-icon name="edit"></app-icon>
            </button>
            <button mat-icon-button color="warn" (click)="excluirSala(s)" aria-label="Excluir">
              <app-icon name="delete"></app-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunasSalas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunasSalas;"></tr>
      </table>
    } @else {
      <p class="lista-vazia">Nenhuma sala cadastrada neste bloco.</p>
    }
  </div>
</div>

<div class="painel-acoes">
  <app-flow-button variant="secondary" class="full-width" type="button" (click)="fechar()">Fechar</app-flow-button>
</div>

<svg viewBox="0 0 100 100" role="img" [attr.aria-label]="descricao()">
  <defs>
    <radialGradient [attr.id]="uid + 'f'" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#fbfaf6" />
      <stop offset="0.85" stop-color="#ecebe4" />
      <stop offset="1" stop-color="#d6d5cc" />
    </radialGradient>
    <linearGradient [attr.id]="uid + 'a'" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f8" />
      <stop offset="0.45" stop-color="#9aa5a9" />
      <stop offset="0.55" stop-color="#6f7a7e" />
      <stop offset="1" stop-color="#dfe5e7" />
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="49" [attr.fill]="'url(#' + uid + 'a)'" />
  <circle cx="50" cy="50" r="44" fill="#3b4447" />
  <circle cx="50" cy="50" r="42.5" [attr.fill]="'url(#' + uid + 'f)'" />

  @for (f of faixas; track f.cor) {
    <path [attr.d]="f.d" fill="none" [attr.stroke]="f.cor" stroke-width="7" />
  }
  @for (m of marcas; track m) {
    <line x1="50" y1="11" x2="50" y2="19" stroke="#2a3134" stroke-width="2.4" [attr.transform]="'rotate(' + m + ' 50 50)'" />
  }

  <g class="ponteiro reserva" [style.transform]="'rotate(' + anguloReserva() + 'deg)'">
    <path d="M50 14 L52 50 L48 50 Z" fill="#e3922c" opacity="0.7" />
  </g>
  <g class="ponteiro" [style.transform]="'rotate(' + anguloConsumo() + 'deg)'">
    <path d="M50 11 L53.4 52 L50 60 L46.6 52 Z" fill="#c62f25" />
  </g>
  <circle cx="50" cy="50" r="6.5" fill="#2a3134" />
  <circle cx="48.6" cy="48.6" r="2.2" fill="#7d878a" />
</svg>

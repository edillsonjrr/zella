<div class="login-background" aria-hidden="true">
  <div class="gradient-orb orb-1"></div>
  <div class="gradient-orb orb-2"></div>

  <!-- Trilha pontilhada ligando as laterais: o caminho que o chamado percorre. -->
  <svg class="trilha" viewBox="0 0 1200 800" preserveAspectRatio="none">
    <path d="M40 140 C 300 60, 420 360, 600 400 S 900 740, 1160 660" />
    <path d="M40 660 C 260 740, 420 440, 600 400 S 940 60, 1160 140" />
  </svg>

  @for (c of cartoes; track $index) {
    <div
      [class]="'cartao cartao--' + c.tamanho"
      [style.top]="c.topo"
      [style.left]="c.lado === 'esq' ? c.deslocamento : null"
      [style.right]="c.lado === 'dir' ? c.deslocamento : null"
      [style.--atraso]="c.atraso"
    >
      <div class="cartao-topo">
        <span class="cartao-icone">
          @switch (c.icone) {
            @case ('chamado') {
              <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
            }
            @case ('os') {
              <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg>
            }
            @case ('orcamento') {
              <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
            }
            @case ('preventiva') {
              <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/></svg>
            }
          }
        </span>
        <span class="linha linha--titulo"></span>
      </div>
      <span class="linha linha--sub"></span>

      <div class="cartao-rodape">
        <span class="etapa">
          <span class="etapa-ponto"></span>
          <span class="etapa-janela">
            <span class="etapa-textos">
              @for (e of etapas; track e) {
                <span>{{ e }}</span>
              }
            </span>
          </span>
        </span>
        <span class="saldo"><span class="saldo-barra"></span></span>
      </div>
    </div>
  }
</div>
